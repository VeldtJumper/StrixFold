name: TCP proxy idle regression
on:
  push:
    branches: [fix/proxy-idle-nanosleep]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  proxy-host-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Zig compiler
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz -o "$RUNNER_TEMP/zig.tar.xz"
          python3 - "$RUNNER_TEMP/zig.tar.xz" <<'PY'
          import hashlib, sys
          with open(sys.argv[1], 'rb') as f:
              assert hashlib.file_digest(f, 'sha256').hexdigest() == '1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026'
          PY
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          printf '%s\n' "$RUNNER_TEMP/zig-x86_64-linux-0.17.0" >> "$GITHUB_PATH"
      - name: Check idle CPU budget on the real proxy loops
        shell: bash
        run: |
          set -euo pipefail
          zig translate-c -lc zig/kernels/hip/dsv41/abi.h > "$RUNNER_TEMP/dsv41-abi.zig"
          zig test -lc --dep gpu -Mroot=zig/src/families/dsv41/tcp_proxy.zig --dep dsv41_abi -Mgpu=zig/src/gpu/hip_facade.zig -Mdsv41_abi="$RUNNER_TEMP/dsv41-abi.zig" --test-filter 'an idle proxy sleeps'
      - name: Check proxy transfers and failure handling
        shell: bash
        run: |
          set -euo pipefail
          for filter in 'the slab protocol' 'split gathers' 'a slot is not reused' 'a generation ahead' 'the device waits' 'a device wait that gave up' 'a peer that stops staging'; do
            zig test -lc --dep gpu -Mroot=zig/src/families/dsv41/tcp_proxy.zig --dep dsv41_abi -Mgpu=zig/src/gpu/hip_facade.zig -Mdsv41_abi="$RUNNER_TEMP/dsv41-abi.zig" --test-filter "$filter"
          done
